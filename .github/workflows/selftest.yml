name: Self-test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate action.yml syntax
        run: |
          python3 -c "
          import yaml
          with open('action.yml') as f:
              data = yaml.safe_load(f)
          required = ['name', 'description', 'runs']
          for key in required:
              assert key in data, f'Missing key: {key}'
          print('action.yml: valid')
          print('  name:', data['name'])
          print('  runs.using:', data['runs']['using'])
          print('  runs.image:', data['runs']['image'])
          print('  flutter-version default:', data['inputs']['flutter-version']['default'])
          print('  ohos-api default:', data['inputs']['ohos-api']['default'])
          "

      - name: Validate entrypoint.sh syntax
        run: |
          bash -n entrypoint.sh && echo 'entrypoint.sh: syntax OK'
          grep -c 'set -euo pipefail' entrypoint.sh > /dev/null && echo 'entrypoint.sh: has set -euo pipefail'

      - name: Check Dockerfile
        run: |
          test -f Dockerfile && echo 'Dockerfile: exists'
          grep -c 'FROM ubuntu' Dockerfile > /dev/null && echo 'Dockerfile: has FROM'
          grep -c 'ENTRYPOINT' Dockerfile > /dev/null && echo 'Dockerfile: has ENTRYPOINT'
          grep -c 'command-line-tools-for-hmos' Dockerfile > /dev/null && echo 'Dockerfile: downloads HarmonyOS Command Line Tools'
          grep -c 'clt-5.1.0.849' Dockerfile > /dev/null && echo 'Dockerfile: pinned to clt-5.1.0.849'
          grep -c '3.41.10-ohos-1.0.1' Dockerfile > /dev/null && echo 'Dockerfile: pinned to flutter 3.41.10-ohos-1.0.1'

      - name: List all files
        run: find . -type f -not -path './.git/*' | sort

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write          # required to push the diagnostics branch
    steps:
      - uses: actions/checkout@v4

      # The embedded CLT is ~2.3 GB compressed / ~6.8 GB extracted and the flutter
      # clone is ~1 GB, so reclaim the preinstalled toolchains first.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      # We deliberately do NOT let this step abort the job: the raw build log is
      # the only way to see what happened, since plain job logs are not readable
      # without an authenticated token that has actions:read.
      - name: Build Docker image (with SDK)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          docker build -t flutter-ohos-builder:test --progress=plain . 2>&1 | tee build.log

      # ---- FORENSICS --------------------------------------------------------
      # Kept from the api-18 investigation. Those runs reached CompileArkTS and
      # died with 27 ArkTS errors inside @ohos/flutter_ohos, e.g.
      #   Namespace 'autoFillManager' has no exported member 'AutoFillType'
      # Upstream's own ReleaseNote for 3.41.9/3.41.10-ohos-1.0.1 settles it:
      # 应用编译最低 SDK = 26.0.0, and "支持密码保险箱功能" (autoFill) is listed among
      # that release's new features - so the engine har genuinely needs API 26.
      # This step now mostly proves it from the artefact side (har @kit imports).
      - name: Forensics - dependency injection and SDK symbol availability
        id: forensics
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          docker run --rm -i --entrypoint bash flutter-ohos-builder:test <<'EOS' 2>&1 | tee forensics.log
          set -x
          cd /tmp
          rm -rf /tmp/fx
          flutter create --platforms=ohos --project-name fx /tmp/fx

          echo "===== [A] generated ohos/oh-package.json5 ====="
          cat /tmp/fx/ohos/oh-package.json5 || true
          echo "===== [B] generated ohos/entry/oh-package.json5 ====="
          cat /tmp/fx/ohos/entry/oh-package.json5 || true
          echo "===== [C] generated ohos/build-profile.json5 ====="
          cat /tmp/fx/ohos/build-profile.json5 || true
          echo "===== [D] hvigor wiring ====="
          cat /tmp/fx/ohos/hvigorfile.ts || true
          cat /tmp/fx/ohos/hvigorconfig.ts || true

          echo "===== [E2] engine artifacts / har, dumped AFTER the build attempt ====="
          # The har only gets downloaded when flutter build runs, so we must build
          # first; the compile step failing is expected and fine here.
          cd /tmp/fx && timeout 2400 flutter build hap --debug 2>&1 | tail -n 40 || true

          echo "===== [F] oh-package.json5 AFTER build (har injection) ====="
          echo "--- root ---";  cat /tmp/fx/ohos/oh-package.json5 || true
          echo "--- entry ---"; cat /tmp/fx/ohos/entry/oh-package.json5 || true
          echo "--- entry .ohpm deps actually installed ---"
          ls /tmp/fx/ohos/oh_modules/.ohpm/ 2>/dev/null | head -n 20 || true

          echo "===== [G] installed @ohos/flutter_ohos manifest ====="
          for f in $(find /tmp/fx/ohos -path '*flutter_ohos*' -name 'oh-package.json5' 2>/dev/null | head -3); do
            echo "--- $f"; head -n 40 "$f" || true
          done

          echo "===== [H] ohpm resolved dependency tree ====="
          cd /tmp/fx/ohos && timeout 300 ohpm list 2>&1 | head -n 40 || true

          echo "===== [M] engine har artifacts on disk ====="
          ls -la /opt/flutter/bin/cache/artifacts/engine/ohos-arm64/ 2>/dev/null || true
          find /opt/flutter/bin/cache -name '*.har' 2>/dev/null | head -n 20 || true

          HAR=$(find /opt/flutter/bin/cache -name 'flutter_embedding_debug.har' 2>/dev/null | head -n 1)
          if [ -n "$HAR" ]; then
            echo "--- har path: $HAR"
            echo "--- har size: $(stat -c%s "$HAR") bytes"
            echo "--- har listing (top 40) ---"
            unzip -l "$HAR" 2>/dev/null | head -n 40 || true
            echo "--- har oh-package.json5 ---"
            unzip -p "$HAR" oh-package.json5 2>/dev/null || echo '(none at root)'
            echo "--- har src/main/module.json5 (SDK requirement) ---"
            unzip -p "$HAR" src/main/module.json5 2>/dev/null || echo '(none)'
            echo "--- @kit.* imports used by the har ets sources ---"
            rm -rf /tmp/harx && mkdir -p /tmp/harx
            cd /tmp/harx && unzip -o -q "$HAR" '*.ets' 2>/dev/null || true
            grep -rho "from '@kit\.[A-Za-z0-9]*'" /tmp/harx 2>/dev/null | sort -u | head -n 40 || true
            echo "--- lines mentioning autoFillManager / CompetitionStrategy ---"
            grep -rn "autoFillManager\|CompetitionStrategy\|getGlobalWindowMode" /tmp/harx 2>/dev/null | head -n 15 || true
          else
            echo 'NO flutter_embedding_debug.har FOUND'
          fi

          echo "===== [N] SDK ets api declarations ====="
          ls /opt/ohos-sdk/sdk/default/openharmony/ets/api/ 2>/dev/null | head -n 25 || true
          for f in @kit.AbilityKit.d.ts @kit.ArkUI.d.ts; do
            p="/opt/ohos-sdk/sdk/default/openharmony/ets/api/$f"
            if [ -f "$p" ]; then
              echo "--- $p ($(wc -l < "$p") lines)"
              grep -c 'AutoFillType' "$p" 2>/dev/null || true
            else
              echo "--- $p MISSING"
            fi
          done

          echo "===== [I] do the ArkTS symbols the har needs exist in THIS SDK? (.d.ts only) ====="
          D=/opt/ohos-sdk/sdk/default/openharmony/ets/api
          for sym in AutoFillType AutoFillTriggerType FillRequest SaveRequest FillFailureResult \
                     BusinessError isCapsLockOn isNumLockOn CompetitionStrategy \
                     getGlobalWindowMode GlobalWindowMode isInFreeWindowMode; do
            found=$(grep -rl --include='*.d.ts' -- "$sym" "$D" /opt/ohos-sdk/sdk/default/hms 2>/dev/null \
                    | head -n 3 | tr '\n' ' ')
            if [ -z "$found" ]; then
              echo "  $sym -> ABSENT from SDK .d.ts"
            else
              echo "  $sym -> present in: $found"
            fi
          done

          echo "===== [J] SDK component versions ====="
          cat /opt/ohos-sdk/sdk/default/openharmony/oh-uni-package.json 2>/dev/null || true
          ls /opt/ohos-sdk/sdk/default/openharmony || true

          echo "===== [K] hvigor plugin versions ====="
          head -n 12 /opt/ohos-sdk/hvigor/hvigor-ohos-plugin/package.json || true

          echo "===== [L] which API dirs does the SDK actually ship? ====="
          find /opt/ohos-sdk/sdk/default -maxdepth 3 -name 'oh-uni-package.json' 2>/dev/null | head -20 || true
          EOS

      # Runs the actual SDK <-> flutter pairing check inside the built image:
      #   flutter create -> inspect generated ohos/build-profile.json5
      #                  -> hvigorw --sync (SDK resolution)
      #                  -> flutter build hap --debug (end to end)
      # Every command is `|| true` on purpose so the diagnostics always get out.
      - name: Probe SDK/flutter pairing inside image
        id: probe
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          docker run --rm -i --entrypoint bash flutter-ohos-builder:test <<'EOS' 2>&1 | tee probe.log
          set -x
          df -h /
          echo "===== SDK metadata (.data) ====="
          cat /opt/ohos-sdk/sdk/default/sdk-pkg.json
          echo "===== flutter --version ====="
          flutter --version
          echo "===== flutter doctor -v ====="
          flutter doctor -v || true
          echo "===== flutter create ====="
          cd /tmp
          flutter create --platforms=ohos --project-name probe /tmp/probe || true
          echo "===== generated ohos/build-profile.json5 ====="
          cat /tmp/probe/ohos/build-profile.json5 || true
          echo "===== generated ohos/entry/build-profile.json5 ====="
          cat /tmp/probe/ohos/entry/build-profile.json5 || true
          echo "===== generated ohos/oh-package.json5 ====="
          cat /tmp/probe/ohos/oh-package.json5 || true
          echo "===== generated ohos/hvigor/hvigor-config.json5 ====="
          cat /tmp/probe/ohos/hvigor/hvigor-config.json5 || true
          echo "===== ls generated ohos ====="
          ls -la /tmp/probe/ohos || true
          echo "===== hvigorw -v (in project) ====="
          cd /tmp/probe/ohos && hvigorw -v --no-daemon || true
          echo "===== hvigorw --sync --no-daemon ====="
          cd /tmp/probe/ohos && hvigorw --sync --no-daemon || true
          echo "===== flutter pub get ====="
          cd /tmp/probe && flutter pub get || true
          echo "===== inject compileSdkVersion (same logic as entrypoint.sh) ====="
          COMPILE_SDK=$(jq -r '.data.platformVersion // empty' /opt/ohos-sdk/sdk/default/sdk-pkg.json)
          echo "SDK platformVersion = ${COMPILE_SDK}"
          perl -0pi -e "s{(\"compatibleSdkVersion\"\s*:\s*\"[^\"]*\",)}{\"compileSdkVersion\": \"${COMPILE_SDK}\",\n        \$1}g" \
            /tmp/probe/ohos/build-profile.json5
          echo "--- build-profile.json5 after injection ---"
          sed -n '/"products"/,/\]/p' /tmp/probe/ohos/build-profile.json5 || true
          echo "===== flutter build hap --debug ====="
          cd /tmp/probe && flutter build hap --debug || true
          echo "===== artifacts ====="
          find /tmp/probe/ohos -name '*.hap' -o -name '*.app' 2>/dev/null || true
          echo "===== df -h / ====="
          df -h /
          EOS

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p .ci
          {
            echo "# CI diagnostics"
            echo
            echo "run: ${GITHUB_RUN_ID}  sha: ${GITHUB_SHA}"
            echo "time: $(date -u +%FT%TZ)"
            echo
            echo "## build outcome: ${{ steps.build.outcome }}"
            echo "## probe outcome: ${{ steps.probe.outcome }}"
            echo
            echo "## build.log (last 500 lines)"
            echo '```'
            tail -n 500 build.log 2>/dev/null || echo '(no build.log)'
            echo '```'
            echo
            echo "## forensics outcome: ${{ steps.forensics.outcome }}"
            echo
            echo "## forensics.log (dependency injection + SDK symbol grep)"
            echo '```'
            cat forensics.log 2>/dev/null || echo '(no forensics.log)'
            echo '```'
            echo
            echo "## hap artifact count"
            echo '```'
            grep -c '\.hap$' <<<"$(find /tmp -name '*.hap' 2>/dev/null)" 2>/dev/null || echo 0
            echo '```'
            echo
            echo "## probe.log (last 500 lines)"
            echo '```'
            tail -n 500 probe.log 2>/dev/null || echo '(no probe.log)'
            echo '```'
            echo
            echo "## image layout probe"
            echo '```'
            docker run --rm --entrypoint bash flutter-ohos-builder:test -c \
              'echo "--- ls /opt/ohos-sdk"; ls -la /opt/ohos-sdk; echo "--- ls sdk"; ls -la /opt/ohos-sdk/sdk; echo "--- ls sdk/default"; ls -la /opt/ohos-sdk/sdk/default; echo "--- sdk-pkg.json"; cat /opt/ohos-sdk/sdk/default/sdk-pkg.json; echo "--- versions"; hvigorw -v; ohpm -v; flutter --version; echo "--- which"; command -v hvigorw; command -v ohpm' 2>&1 \
              || echo '(image not built - probe unavailable)'
            echo '```'
          } > .ci/diagnostics.md
          echo "----- diagnostics begin -----"
          cat .ci/diagnostics.md
          echo "----- diagnostics end -----"

      - name: Push diagnostics to ci-diagnostics branch
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci/diagnostics.md
          git commit -m "ci: diagnostics for ${GITHUB_SHA}" || echo "nothing to commit"
          git push origin HEAD:refs/heads/ci-diagnostics --force

      - name: Verify SDK tools inside image
        if: steps.build.outcome == 'success'
        run: |
          docker run --rm --entrypoint bash flutter-ohos-builder:test -c \
            'hvigorw -v && ohpm -v && flutter --version && echo "ALL OK"'

      - name: Fail if image build failed
        if: steps.build.outcome != 'success'
        run: exit 1
