name: 'Flutter OHOS Builder'
description: 'Build Flutter apps into HarmonyOS .hap/.app packages (HarmonyOS Command Line Tools + SDK embedded)'
author: 'zhongdaiqi'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  flutter-version:
    description: 'Flutter OHOS fork version, i.e. a tag of zhongdaiqi/flutter_flutter (e.g. 3.41.10-ohos-1.0.1)'
    required: true
    default: '3.41.10-ohos-1.0.1'
  ohos-api:
    description: 'HarmonyOS API level baked into the image (26 for Command Line Tools 26.0.0 / clt-26.0.0.851)'
    required: true
    default: '26'
  build-mode:
    description: 'Build mode: debug or release'
    required: false
    default: 'release'
  build-target:
    description: 'Build target: hap, app or android'
    required: false
    default: 'app'
  project-path:
    description: 'Path to the Flutter project root'
    required: false
    default: '.'

  # ---- app identity (not secret) -------------------------------------------
  bundle-name:
    description: 'bundleName written into ohos/AppScope/app.json5, e.g. com.zhongdaiqi.app. MUST match the one your .p7b profile was provisioned for, otherwise signing fails.'
    required: false
    default: ''
  app-name:
    description: 'Display name written into ohos/AppScope/resources/base/element/string.json'
    required: false
    default: ''

  # ---- ohos signing --------------------------------------------------------
  ohos-sign-enabled:
    description: 'Enable OHOS signing: true or false. Release builds cannot produce a package without it.'
    required: false
    default: 'false'
  ohos-sign-alg:
    description: 'signAlg, normally SHA256withECDSA'
    required: false
    default: 'SHA256withECDSA'
  ohos-sign-key-alias:
    description: 'keyAlias of the .p12 keystore'
    required: false
    default: ''
  ohos-sign-key-password:
    description: 'keyPassword - the alias password inside the .p12'
    required: false
    default: ''
  ohos-sign-store-password:
    description: 'storePassword - the .p12 keystore password'
    required: false
    default: ''
  ohos-sign-cert-base64:
    description: 'AGC certificate (.cer) base64-encoded, single line, no line breaks'
    required: false
    default: ''
  ohos-sign-profile-base64:
    description: 'Provisioning profile (.p7b) base64-encoded, single line, no line breaks'
    required: false
    default: ''
  ohos-sign-store-file-base64:
    description: 'Keystore (.p12) base64-encoded, single line, no line breaks'
    required: false
    default: ''
  ohos-sign-material-base64:
    description: 'ZIP of the DevEco signing material/ directory (the per-keystore files that sit next to the .p12 and are required to decrypt the encrypted keyPassword/storePassword), base64-encoded, single line'
    required: false
    default: ''

  # ---- android signing ----------------------------------------------------
  android-sign-enabled:
    description: 'Enable Android signing for android builds: true or false (default false).'
    required: false
    default: 'false'
  android-sign-key-alias:
    description: 'Key alias inside the Android keystore (.jks or .keystore)'
    required: false
    default: ''
  android-sign-key-password:
    description: 'Key password (alias password) for the Android keystore'
    required: false
    default: ''
  android-sign-store-base64:
    description: 'Android keystore file (.jks/.keystore) base64-encoded, single line'
    required: false
    default: ''
  android-sign-store-password:
    description: 'Keystore password for the Android keystore'
    required: false
    default: ''

outputs:
  artifact-path:
    description: 'Path to the built .hap/.app/.apk artifact'
    value: ${{ steps.build.outputs.artifact-path }}
  build-log:
    description: 'Path to flutter-ohos-build.log, full output of the build'
    value: ${{ steps.build.outputs.build-log }}

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - '--flutter-version'
    - ${{ inputs.flutter-version }}
    - '--ohos-api'
    - ${{ inputs.ohos-api }}
    - '--build-mode'
    - ${{ inputs.build-mode }}
    - '--build-target'
    - ${{ inputs.build-target }}
    - '--project-path'
    - ${{ inputs.project-path }}
    - '--bundle-name'
    - ${{ inputs.bundle-name }}
    - '--app-name'
    - ${{ inputs.app-name }}

    # OHOS signing
    - '--ohos-sign-enabled'
    - ${{ inputs.ohos-sign-enabled }}
    - '--ohos-sign-alg'
    - ${{ inputs.ohos-sign-alg }}
    - '--ohos-sign-key-alias'
    - ${{ inputs.ohos-sign-key-alias }}
    - '--ohos-sign-key-password'
    - ${{ inputs.ohos-sign-key-password }}
    - '--ohos-sign-store-password'
    - ${{ inputs.ohos-sign-store-password }}
    - '--ohos-sign-cert-base64'
    - ${{ inputs.ohos-sign-cert-base64 }}
    - '--ohos-sign-profile-base64'
    - ${{ inputs.ohos-sign-profile-base64 }}
    - '--ohos-sign-store-file-base64'
    - ${{ inputs.ohos-sign-store-file-base64 }}
    - '--ohos-sign-material-base64'
    - ${{ inputs.ohos-sign-material-base64 }}

    # Android signing
    - '--android-sign-enabled'
    - ${{ inputs.android-sign-enabled }}
    - '--android-sign-key-alias'
    - ${{ inputs.android-sign-key-alias }}
    - '--android-sign-key-password'
    - ${{ inputs.android-sign-key-password }}
    - '--android-sign-store-base64'
    - ${{ inputs.android-sign-store-base64 }}
    - '--android-sign-store-password'
    - ${{ inputs.android-sign-store-password }}
